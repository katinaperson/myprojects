<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Projects</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1A1A1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="My Projects">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap');

  :root {
    --teal: #3DBFA8;
    --teal-dark: #2A9E8A;
    --teal-light: #E6F7F5;
    --teal-mid: #B2E4DC;
    --header-bg: #1A1A1A;
    --header-border: #2E2E2E;
    --cream: #F0EDE8;
    --warm-white: #F8F6F2;
    --card-bg: #FFFFFF;
    --text-dark: #1A1A1A;
    --text-mid: #444444;
    --text-light: #777777;
    --text-muted: #AAAAAA;
    --border: #E0DDD8;
    --border-soft: #ECEAE6;
    --success: #3DBFA8;
    --success-light: #E6F7F5;
    --warning: #C4956A;
    --warning-light: #FAF0E6;
    --shadow-soft: 0 2px 12px rgba(0,0,0,0.06);
    --shadow-card: 0 4px 20px rgba(0,0,0,0.10);
    --shadow-modal: 0 20px 60px rgba(0,0,0,0.18);
    --radius: 12px;
    --radius-sm: 8px;
    --radius-xs: 5px;
    /* Card accent colors — matching SoftStart's per-card top borders */
    --accent-1: #3DBFA8; /* teal */
    --accent-2: #C4956A; /* gold */
    --accent-3: #C07A7A; /* dusty rose */
    --accent-4: #1A1A1A; /* near black */
    --accent-5: #7B5EA7; /* purple */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream);
    color: var(--text-dark);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--header-bg);
    border-bottom: 1px solid var(--header-border);
    padding: 0 32px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }

  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 68px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-icon {
    width: 36px;
    height: 36px;
    background: var(--teal);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .brand-name {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    font-weight: 400;
    color: #FFFFFF;
    letter-spacing: -0.2px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .btn-primary {
    background: var(--teal);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    background: var(--teal-dark);
    box-shadow: 0 4px 14px rgba(61,191,168,0.35);
  }

  .btn-secondary {
    background: var(--teal-light);
    color: var(--teal-dark);
    border: 1px solid var(--teal-mid);
    padding: 9px 16px;
    border-radius: var(--radius-sm);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-secondary:hover {
    background: var(--teal-mid);
  }

  .btn-ghost {
    background: none;
    border: none;
    color: var(--text-light);
    cursor: pointer;
    padding: 6px 10px;
    border-radius: var(--radius-xs);
    font-size: 14px;
    transition: all 0.15s;
  }

  .btn-ghost:hover { background: var(--teal-light); color: var(--teal-dark); }

  /* ── TABS ── */
  .tab-bar {
    background: var(--header-bg);
    border-bottom: 2px solid var(--header-border);
    padding: 0 32px;
  }

  .tab-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    gap: 0;
  }

  .tab {
    padding: 14px 22px;
    font-size: 13px;
    font-weight: 500;
    color: #888;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    font-family: 'Inter', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  .tab:hover { color: var(--teal); }
  .tab.active { color: var(--teal); border-bottom-color: var(--teal); }

  /* ── MAIN ── */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px;
  }

  /* ── SUMMARY STRIP ── */
  .summary-strip {
    display: flex;
    gap: 16px;
    margin-bottom: 32px;
  }

  .summary-pill {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    box-shadow: var(--shadow-soft);
    position: relative;
    overflow: hidden;
  }

  .summary-pill::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }

  .pill-active::before { background: var(--accent-1); }   /* teal */
  .pill-upcoming::before { background: var(--accent-2); } /* gold */
  .pill-done::before { background: var(--accent-3); }     /* dusty rose */

  .summary-pill-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .pill-active .summary-pill-icon { background: var(--teal-light); }
  .pill-upcoming .summary-pill-icon { background: var(--warning-light); }
  .pill-done .summary-pill-icon { background: var(--success-light); }

  .summary-pill-text { line-height: 1.2; }
  .summary-pill-num { font-size: 22px; font-weight: 600; color: var(--text-dark); }
  .summary-pill-label { font-size: 12px; color: var(--text-light); margin-top: 1px; }

  /* ── SECTION HEADING ── */
  .section-heading {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--text-dark);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    letter-spacing: -0.3px;
  }

  .section-tag {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  /* ── PROJECT GRID ── */
  .project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
  }

  /* ── PROJECT CARD ── */
  .project-card {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-soft);
    position: relative;
    overflow: hidden;
  }

  .project-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--card-accent, var(--teal));
  }

  .project-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-card);
    border-color: var(--teal-mid);
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .card-category {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.9px;
    padding: 3px 9px;
    border-radius: 20px;
    background: var(--rose-blush);
    color: var(--rose-deep);
  }

  .cat-work { background: #E8EEF5; color: #4A6FA5; }
  .cat-business { background: #F0EBF8; color: #7B5EA7; }
  .cat-personal { background: var(--teal-light); color: var(--teal-dark); }

  .card-menu { position: relative; }

  .card-menu-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 4px;
    font-size: 16px;
    line-height: 1;
    transition: all 0.15s;
  }

  .card-menu-btn:hover { background: var(--teal-light); color: var(--teal-dark); }

  .dropdown-menu {
    position: absolute;
    right: 0;
    top: 28px;
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-card);
    z-index: 50;
    min-width: 140px;
    overflow: hidden;
    display: none;
  }

  .dropdown-menu.open { display: block; }

  .dropdown-item {
    padding: 10px 14px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text-mid);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s;
  }

  .dropdown-item:hover { background: var(--teal-light); }
  .dropdown-item.danger { color: #C0392B; }
  .dropdown-item.danger:hover { background: #FEF0EF; }

  .card-title {
    font-family: 'DM Serif Display', serif;
    font-size: 17px;
    font-weight: 400;
    color: var(--text-dark);
    margin-bottom: 6px;
    line-height: 1.3;
    letter-spacing: -0.2px;
  }

  .card-window {
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .progress-section { margin-bottom: 12px; }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-light);
    margin-bottom: 5px;
  }

  .progress-bar {
    height: 6px;
    background: var(--teal-light);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--teal);
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  .budget-section { margin-top: 10px; }

  .budget-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-light);
    margin-bottom: 5px;
  }

  .budget-bar {
    height: 5px;
    background: var(--warning-light);
    border-radius: 3px;
    overflow: hidden;
  }

  .budget-fill {
    height: 100%;
    background: linear-gradient(90deg, #E8B89A, var(--warning));
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  .budget-fill.over { background: linear-gradient(90deg, #E89A9A, #C0392B); }

  .card-completed-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--success);
    background: var(--success-light);
    padding: 3px 9px;
    border-radius: 20px;
    margin-top: 10px;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  .empty-state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
  .empty-state-text { font-size: 15px; margin-bottom: 8px; color: var(--text-light); }
  .empty-state-sub { font-size: 13px; }

  /* ── COMPLETED TOGGLE ── */
  .completed-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-light);
    cursor: pointer;
    padding: 8px 0;
    margin-bottom: 16px;
    user-select: none;
  }

  .completed-toggle:hover { color: var(--teal); }

  /* ── MODAL OVERLAY ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(61, 43, 43, 0.35);
    backdrop-filter: blur(3px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--warm-white);
    border-radius: var(--radius);
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow-modal);
    transform: translateY(10px);
    transition: transform 0.2s;
  }

  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-header {
    padding: 24px 28px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    font-weight: 400;
    color: var(--text-dark);
    letter-spacing: -0.3px;
  }

  .modal-close {
    background: none;
    border: none;
    font-size: 20px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    line-height: 1;
    transition: all 0.15s;
  }

  .modal-close:hover { background: var(--teal-light); color: var(--teal-dark); }

  .modal-body { padding: 20px 28px 28px; }

  /* ── FORM ── */
  .form-group { margin-bottom: 18px; }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-mid);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 6px;
  }

  .form-input, .form-select, .form-textarea {
    width: 100%;
    padding: 10px 13px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--text-dark);
    background: white;
    transition: border-color 0.15s;
    outline: none;
  }

  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(61,191,168,0.15);
  }

  .form-textarea { resize: vertical; min-height: 70px; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .form-check {
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-mid);
  }

  .form-check input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--rose-deep);
    cursor: pointer;
  }

  .modal-footer {
    padding: 0 28px 24px;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  /* ── PROJECT DETAIL VIEW ── */
  #detail-view {
    display: none;
  }

  .detail-back {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-light);
    cursor: pointer;
    margin-bottom: 24px;
    padding: 8px 0;
    transition: color 0.15s;
    background: none;
    border: none;
    font-family: 'Inter', sans-serif;
  }

  .detail-back:hover { color: var(--teal); }

  .detail-header {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 24px;
    box-shadow: var(--shadow-soft);
  }

  .detail-header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .detail-title {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    font-weight: 400;
    color: var(--text-dark);
    flex: 1;
    margin-right: 16px;
    line-height: 1.2;
    letter-spacing: -0.4px;
  }

  .detail-meta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 20px;
  }

  .detail-meta-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    color: var(--text-light);
  }

  .detail-progress-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .detail-stat-box {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
  }

  .detail-stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-light);
    margin-bottom: 4px;
  }

  .detail-stat-value {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-dark);
  }

  /* ── CHECKLIST ── */
  .checklist-section {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 28px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-soft);
  }

  .checklist-heading {
    font-family: 'DM Serif Display', serif;
    font-size: 19px;
    font-weight: 400;
    color: var(--text-dark);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    letter-spacing: -0.2px;
  }

  .step-item {
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
    background: var(--warm-white);
    overflow: hidden;
    transition: all 0.15s;
  }

  .step-item:hover { border-color: var(--teal-mid); }

  .step-main {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    cursor: pointer;
  }

  .step-checkbox {
    width: 20px;
    height: 20px;
    border: 2px solid var(--teal);
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
    transition: all 0.15s;
    background: white;
  }

  .step-checkbox.checked {
    background: var(--teal);
    border-color: var(--teal);
    color: white;
  }

  .step-checkbox.checked::after { content: '✓'; font-size: 12px; font-weight: 700; }

  .step-title {
    flex: 1;
    font-size: 14px;
    color: var(--text-dark);
    font-weight: 500;
  }

  .step-title.done {
    text-decoration: line-through;
    color: var(--text-muted);
  }

  .step-actions {
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .step-item:hover .step-actions { opacity: 1; }

  .step-btn {
    background: none;
    border: none;
    padding: 4px 6px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-muted);
    transition: all 0.15s;
  }

  .step-btn:hover { background: var(--teal-light); color: var(--teal-dark); }
  .step-btn.danger:hover { background: #FEF0EF; color: #C0392B; }

  .step-notes {
    padding: 0 16px 13px 48px;
    font-size: 12px;
    color: var(--text-light);
    line-height: 1.5;
    display: none;
  }

  .step-notes.visible { display: block; }

  .step-notes-input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    color: var(--text-dark);
    background: white;
    resize: vertical;
    min-height: 50px;
    outline: none;
    display: none;
  }

  .step-notes-input:focus { border-color: var(--teal); }
  .step-notes-input.visible { display: block; }

  .add-step-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  .add-step-input {
    flex: 1;
    padding: 10px 13px;
    border: 1px dashed var(--teal-mid);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    color: var(--text-dark);
    background: white;
    outline: none;
    transition: border-color 0.15s;
  }

  .add-step-input:focus { border-color: var(--teal); border-style: solid; }
  .add-step-input::placeholder { color: var(--text-muted); }

  /* ── BUDGET DETAIL ── */
  .budget-detail-section {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 28px;
    box-shadow: var(--shadow-soft);
  }

  .budget-summary-row {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
  }

  .budget-summary-box {
    flex: 1;
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 13px 16px;
    text-align: center;
  }

  .budget-summary-box.over-budget { background: #FEF0EF; border-color: #F5C6C6; }

  .budget-summary-amount {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 2px;
  }

  .budget-summary-box.over-budget .budget-summary-amount { color: #C0392B; }

  .budget-summary-desc { font-size: 11px; color: var(--text-light); }

  .expense-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-soft);
    font-size: 13px;
  }

  .expense-item:last-child { border-bottom: none; }

  .expense-desc { color: var(--text-mid); flex: 1; }

  .expense-amount {
    font-weight: 600;
    color: var(--text-dark);
    margin-left: 16px;
  }

  .expense-delete {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 3px 6px;
    border-radius: 3px;
    font-size: 12px;
    margin-left: 8px;
    transition: all 0.15s;
  }

  .expense-delete:hover { background: #FEF0EF; color: #C0392B; }

  .add-expense-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px;
    margin-top: 14px;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 28px;
    right: 28px;
    background: var(--text-dark);
    color: white;
    padding: 12px 18px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    z-index: 999;
    transform: translateY(10px);
    opacity: 0;
    transition: all 0.25s;
    pointer-events: none;
  }

  .toast.show { transform: translateY(0); opacity: 1; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--rose-soft); border-radius: 3px; }

  /* ── STEP EDIT INLINE ── */
  .step-edit-input {
    flex: 1;
    padding: 3px 7px;
    border: 1px solid var(--rose-mid);
    border-radius: 4px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">⊞</div>
      <span class="brand-name">My Projects</span>
    </div>
    <div class="header-actions">
      <span id="save-indicator" style="font-size:12px;color:#888;">✓ Changes saved</span>
      <button class="btn-primary" onclick="openNewProjectModal()">+ New Project</button>
    </div>
  </div>
</header>

<div class="tab-bar">
  <div class="tab-inner">
    <button class="tab active" onclick="setTab('all', this)">All</button>
    <button class="tab" onclick="setTab('work', this)">Work</button>
    <button class="tab" onclick="setTab('business', this)">Business</button>
    <button class="tab" onclick="setTab('personal', this)">Personal</button>
  </div>
</div>

<!-- DASHBOARD VIEW -->
<main id="dashboard-view">

  <div class="summary-strip" id="summary-strip">
    <div class="summary-pill pill-active">
      <div class="summary-pill-icon">📋</div>
      <div class="summary-pill-text">
        <div class="summary-pill-num" id="count-active">0</div>
        <div class="summary-pill-label">Active Projects</div>
      </div>
    </div>
    <div class="summary-pill pill-upcoming">
      <div class="summary-pill-icon">🗓️</div>
      <div class="summary-pill-text">
        <div class="summary-pill-num" id="count-upcoming">0</div>
        <div class="summary-pill-label">Upcoming</div>
      </div>
    </div>
    <div class="summary-pill pill-done">
      <div class="summary-pill-icon">✅</div>
      <div class="summary-pill-text">
        <div class="summary-pill-num" id="count-done">0</div>
        <div class="summary-pill-label">Completed</div>
      </div>
    </div>
  </div>

  <!-- Active Projects -->
  <div id="active-section">
    <div class="section-heading">
      Active <span class="section-tag">In progress</span>
    </div>
    <div class="project-grid" id="active-grid"></div>
  </div>

  <!-- Upcoming Projects -->
  <div id="upcoming-section">
    <div class="section-heading">
      Upcoming <span class="section-tag">Not yet started</span>
    </div>
    <div class="project-grid" id="upcoming-grid"></div>
  </div>

  <!-- Completed Toggle -->
  <div id="completed-section" style="display:none;">
    <div class="completed-toggle" onclick="toggleCompleted()">
      <span id="completed-arrow">▶</span>
      <span>Completed Projects</span>
      <span id="completed-count-badge" style="background:var(--success-light);color:var(--success);font-size:11px;padding:2px 8px;border-radius:20px;margin-left:4px;"></span>
    </div>
    <div class="project-grid" id="completed-grid" style="display:none;"></div>
  </div>

</main>

<!-- DETAIL VIEW -->
<main id="detail-view">
  <button class="detail-back" onclick="showDashboard()">← Back to Projects</button>

  <div class="detail-header">
    <div class="detail-header-top">
      <div class="detail-title" id="detail-title"></div>
      <div style="display:flex;gap:8px;align-items:center;">
        <span class="card-category" id="detail-category"></span>
        <button class="btn-secondary" onclick="editCurrentProject()">Edit</button>
      </div>
    </div>
    <div class="detail-meta">
      <div class="detail-meta-item" id="detail-window">📅 —</div>
      <div class="detail-meta-item" id="detail-status-badge"></div>
    </div>
    <div class="detail-progress-row">
      <div class="detail-stat-box">
        <div class="detail-stat-label">Progress</div>
        <div class="detail-stat-value" id="detail-progress-text">0 of 0 steps</div>
        <div class="progress-bar" style="margin-top:8px;">
          <div class="progress-fill" id="detail-progress-fill" style="width:0%"></div>
        </div>
      </div>
      <div class="detail-stat-box" id="detail-budget-box">
        <div class="detail-stat-label">Budget</div>
        <div class="detail-stat-value" id="detail-budget-text">—</div>
        <div class="budget-bar" style="margin-top:8px;">
          <div class="budget-fill" id="detail-budget-fill" style="width:0%"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Checklist -->
  <div class="checklist-section">
    <div class="checklist-heading">
      Steps
      <span id="steps-count-badge" style="font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--text-light);"></span>
    </div>
    <div id="steps-list"></div>
    <div class="add-step-row">
      <input class="add-step-input" id="new-step-input" placeholder="Add a step... press Enter to save" onkeydown="handleAddStep(event)">
      <button class="btn-primary" onclick="addStep()">Add</button>
    </div>
  </div>

  <!-- Budget Detail -->
  <div class="budget-detail-section" id="budget-detail-section">
    <div class="checklist-heading">Budget</div>
    <div class="budget-summary-row" id="budget-summary-row"></div>
    <div id="expenses-list"></div>
    <div class="add-expense-row" id="add-expense-row" style="display:none;">
      <input class="form-input" id="expense-desc-input" placeholder="Description (e.g. Storage bins)">
      <input class="form-input" id="expense-amount-input" placeholder="$0.00" style="width:110px;">
      <button class="btn-primary" onclick="addExpense()">Add</button>
    </div>
  </div>
</main>

<!-- PROJECT FORM MODAL -->
<div class="modal-overlay" id="project-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">New Project</div>
      <button class="modal-close" onclick="closeProjectModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Project Name *</label>
        <input class="form-input" id="f-name" placeholder="e.g. Declutter Living Room">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Category</label>
          <select class="form-select" id="f-category">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="business">Business</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-select" id="f-status">
            <option value="active">Active</option>
            <option value="upcoming">Upcoming</option>
            <option value="completed">Completed</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Start Date</label>
          <input class="form-input" id="f-start" type="date">
        </div>
        <div class="form-group">
          <label class="form-label">Target End Date</label>
          <input class="form-input" id="f-end" type="date">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Budget</label>
        <input class="form-input" id="f-budget" type="number" placeholder="0.00" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label class="form-check">
          <input type="checkbox" id="f-itemize">
          Track itemized expenses (log each purchase separately)
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeProjectModal()">Cancel</button>
      <button class="btn-primary" onclick="saveProject()">Save Project</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── DATA ──
let projects = [];
let currentTab = 'all';
let currentProjectId = null;
let editingProjectId = null;
let completedOpen = false;

function genId() { return 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2,5); }

function save() {
  localStorage.setItem('myprojects_v2', JSON.stringify(projects));
  showSaveIndicator();
}

function load() {
  const raw = localStorage.getItem('myprojects_v2');
  if (raw) {
    try { projects = JSON.parse(raw); } catch(e) { projects = []; }
  }
}

function showSaveIndicator() {
  const el = document.getElementById('save-indicator');
  el.textContent = '✓ Saved';
  el.style.color = '#3DBFA8';
  setTimeout(() => {
    el.textContent = '✓ Changes saved';
    el.style.color = '#888';
  }, 1500);
}

// ── TABS ──
function setTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderDashboard();
}

function filterProjects(list) {
  if (currentTab === 'all') return list;
  return list.filter(p => p.category === currentTab);
}

// ── DASHBOARD ──
function renderDashboard() {
  const all = filterProjects(projects);
  const active = all.filter(p => p.status === 'active');
  const upcoming = all.filter(p => p.status === 'upcoming');
  const completed = all.filter(p => p.status === 'completed');

  document.getElementById('count-active').textContent = active.length;
  document.getElementById('count-upcoming').textContent = upcoming.length;
  document.getElementById('count-done').textContent = completed.length;

  renderGrid('active-grid', active);
  renderGrid('upcoming-grid', upcoming);

  document.getElementById('active-section').style.display = active.length ? '' : 'none';
  document.getElementById('upcoming-section').style.display = upcoming.length ? '' : 'none';

  const completedSection = document.getElementById('completed-section');
  completedSection.style.display = completed.length ? '' : 'none';
  document.getElementById('completed-count-badge').textContent = completed.length;
  if (completedOpen) {
    renderGrid('completed-grid', completed);
  }

  if (!active.length && !upcoming.length && !completed.length) {
    document.getElementById('active-section').style.display = '';
    document.getElementById('active-grid').innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <div class="empty-state-icon">📋</div>
        <div class="empty-state-text">No projects yet</div>
        <div class="empty-state-sub">Click "New Project" to get started</div>
      </div>`;
  }
}

function renderGrid(gridId, list) {
  const grid = document.getElementById(gridId);
  if (!list.length) { grid.innerHTML = ''; return; }
  grid.innerHTML = list.map(p => projectCard(p)).join('');
}

const ACCENTS = ['#3DBFA8','#C4956A','#C07A7A','#4A6FA5','#7B5EA7'];
function getAccent(id) {
  // deterministic color from project id
  let hash = 0;
  for (let i = 0; i < id.length; i++) hash = id.charCodeAt(i) + ((hash << 5) - hash);
  return ACCENTS[Math.abs(hash) % ACCENTS.length];
}

function projectCard(p) {
  const steps = p.steps || [];
  const done = steps.filter(s => s.checked).length;
  const total = steps.length;
  const pct = total ? Math.round((done/total)*100) : 0;
  const accent = getAccent(p.id);

  const spent = getSpent(p);
  const budget = parseFloat(p.budget) || 0;
  const budgetPct = budget ? Math.min(100, Math.round((spent/budget)*100)) : 0;
  const overBudget = budget && spent > budget;

  const catClass = p.category === 'work' ? 'cat-work' : p.category === 'business' ? 'cat-business' : 'cat-personal';
  const catLabel = p.category.charAt(0).toUpperCase() + p.category.slice(1);

  let windowStr = '';
  if (p.startDate || p.endDate) {
    const parts = [];
    if (p.startDate) parts.push(formatDate(p.startDate));
    if (p.endDate) parts.push(formatDate(p.endDate));
    windowStr = `<div class="card-window">📅 ${parts.join(' → ')}</div>`;
  }

  let budgetBar = '';
  if (budget > 0) {
    budgetBar = `
      <div class="budget-section">
        <div class="budget-label">
          <span>Budget</span>
          <span ${overBudget ? 'style="color:#C0392B;font-weight:600;"' : ''}>$${spent.toFixed(2)} / $${budget.toFixed(2)}</span>
        </div>
        <div class="budget-bar"><div class="budget-fill ${overBudget ? 'over' : ''}" style="width:${budgetPct}%"></div></div>
      </div>`;
  }

  let completedBadge = p.status === 'completed' ? `<div class="card-completed-badge">✓ Completed</div>` : '';

  return `
    <div class="project-card" style="--card-accent:${accent}" onclick="openProject('${p.id}')">
      <div class="card-top">
        <span class="card-category ${catClass}">${catLabel}</span>
        <div class="card-menu">
          <button class="card-menu-btn" onclick="toggleMenu(event,'menu-${p.id}')">⋯</button>
          <div class="dropdown-menu" id="menu-${p.id}">
            <div class="dropdown-item" onclick="editProject(event,'${p.id}')">✏️ Edit</div>
            <div class="dropdown-item" onclick="markStatus(event,'${p.id}','active')">📋 Mark Active</div>
            <div class="dropdown-item" onclick="markStatus(event,'${p.id}','upcoming')">🗓️ Mark Upcoming</div>
            <div class="dropdown-item" onclick="markStatus(event,'${p.id}','completed')">✅ Mark Complete</div>
            <div class="dropdown-item danger" onclick="deleteProject(event,'${p.id}')">🗑️ Delete</div>
          </div>
        </div>
      </div>
      <div class="card-title">${p.name}</div>
      ${windowStr}
      ${total > 0 ? `
      <div class="progress-section">
        <div class="progress-label"><span>Progress</span><span>${done} of ${total} steps</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>` : ''}
      ${budgetBar}
      ${completedBadge}
    </div>`;
}

function toggleMenu(e, id) {
  e.stopPropagation();
  document.querySelectorAll('.dropdown-menu').forEach(m => {
    if (m.id !== id) m.classList.remove('open');
  });
  document.getElementById(id).classList.toggle('open');
}

document.addEventListener('click', () => {
  document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('open'));
});

function editProject(e, id) {
  e.stopPropagation();
  openNewProjectModal(id);
}

function markStatus(e, id, status) {
  e.stopPropagation();
  const p = projects.find(x => x.id === id);
  if (p) { p.status = status; save(); renderDashboard(); showToast('Status updated'); }
}

function deleteProject(e, id) {
  e.stopPropagation();
  if (!confirm('Delete this project? This cannot be undone.')) return;
  projects = projects.filter(p => p.id !== id);
  save();
  renderDashboard();
  showToast('Project deleted');
}

function toggleCompleted() {
  completedOpen = !completedOpen;
  document.getElementById('completed-arrow').textContent = completedOpen ? '▼' : '▶';
  const grid = document.getElementById('completed-grid');
  grid.style.display = completedOpen ? '' : 'none';
  if (completedOpen) {
    const completed = filterProjects(projects).filter(p => p.status === 'completed');
    renderGrid('completed-grid', completed);
  }
}

// ── PROJECT DETAIL ──
function openProject(id) {
  currentProjectId = id;
  document.getElementById('dashboard-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'block';
  renderDetail();
}

function showDashboard() {
  document.getElementById('dashboard-view').style.display = 'block';
  document.getElementById('detail-view').style.display = 'none';
  currentProjectId = null;
  renderDashboard();
}

function renderDetail() {
  const p = projects.find(x => x.id === currentProjectId);
  if (!p) return showDashboard();

  document.getElementById('detail-title').textContent = p.name;

  const catEl = document.getElementById('detail-category');
  catEl.textContent = p.category.charAt(0).toUpperCase() + p.category.slice(1);
  catEl.className = 'card-category ' + (p.category === 'work' ? 'cat-work' : p.category === 'business' ? 'cat-business' : 'cat-personal');

  let windowStr = '📅 No target window set';
  if (p.startDate || p.endDate) {
    const parts = [];
    if (p.startDate) parts.push(formatDate(p.startDate));
    if (p.endDate) parts.push(formatDate(p.endDate));
    windowStr = '📅 ' + parts.join(' → ');
  }
  document.getElementById('detail-window').textContent = windowStr;

  const statusColors = { active: 'var(--rose-deep)', upcoming: 'var(--warning)', completed: 'var(--success)' };
  const statusLabels = { active: '● Active', upcoming: '● Upcoming', completed: '● Completed' };
  const statusEl = document.getElementById('detail-status-badge');
  statusEl.textContent = statusLabels[p.status] || '';
  statusEl.style.color = statusColors[p.status] || 'var(--text-light)';

  const steps = p.steps || [];
  const done = steps.filter(s => s.checked).length;
  const total = steps.length;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('detail-progress-text').textContent = `${done} of ${total} steps`;
  document.getElementById('detail-progress-fill').style.width = pct + '%';

  const spent = getSpent(p);
  const budget = parseFloat(p.budget) || 0;
  const budgetBox = document.getElementById('detail-budget-box');
  if (budget > 0) {
    const budgetPct = Math.min(100, Math.round((spent/budget)*100));
    const overBudget = spent > budget;
    document.getElementById('detail-budget-text').textContent = `$${spent.toFixed(2)} / $${budget.toFixed(2)}`;
    document.getElementById('detail-budget-fill').style.width = budgetPct + '%';
    document.getElementById('detail-budget-fill').className = 'budget-fill' + (overBudget ? ' over' : '');
    budgetBox.style.display = '';
  } else {
    budgetBox.style.display = 'none';
  }

  renderSteps();
  renderBudgetSection();
}

function renderSteps() {
  const p = projects.find(x => x.id === currentProjectId);
  if (!p) return;
  const steps = p.steps || [];
  const done = steps.filter(s => s.checked).length;

  document.getElementById('steps-count-badge').textContent = `${done} of ${steps.length} done`;

  const list = document.getElementById('steps-list');
  if (!steps.length) {
    list.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px;">No steps yet — add your first one below</div>`;
    return;
  }

  list.innerHTML = steps.map((s, i) => `
    <div class="step-item" id="step-${i}">
      <div class="step-main">
        <div class="step-checkbox ${s.checked ? 'checked' : ''}" onclick="toggleStep(${i})"></div>
        <span class="step-title ${s.checked ? 'done' : ''}" id="step-title-${i}">${s.title}</span>
        <div class="step-actions">
          <button class="step-btn" onclick="toggleStepNotes(${i})" title="Notes">📝</button>
          <button class="step-btn" onclick="editStep(${i})" title="Edit">✏️</button>
          <button class="step-btn danger" onclick="deleteStep(${i})" title="Delete">✕</button>
        </div>
      </div>
      <div class="step-notes ${s.notes ? 'visible' : ''}" id="step-notes-${i}">
        <textarea class="step-notes-input visible" id="step-notes-input-${i}" placeholder="Add notes for this step..." onblur="saveStepNote(${i})">${s.notes || ''}</textarea>
      </div>
    </div>
  `).join('');
}

function toggleStep(i) {
  const p = projects.find(x => x.id === currentProjectId);
  if (!p) return;
  p.steps[i].checked = !p.steps[i].checked;
  save();
  renderDetail();
}

function toggleStepNotes(i) {
  const notesDiv = document.getElementById(`step-notes-${i}`);
  const input = document.getElementById(`step-notes-input-${i}`);
  const isVisible = notesDiv.classList.contains('visible');
  notesDiv.classList.toggle('visible', !isVisible);
  input.classList.toggle('visible', !isVisible);
  if (!isVisible) input.focus();
}

function saveStepNote(i) {
  const p = projects.find(x => x.id === currentProjectId);
  if (!p) return;
  p.steps[i].notes = document.getElementById(`step-notes-input-${i}`).value;
  save();
}

function editStep(i) {
  const p = projects.find(x => x.id === currentProjectId);
  if (!p) return;
  const titleEl = document.getElementById(`step-title-${i}`);
  const current = p.steps[i].title;
  titleEl.innerHTML = `<input class="step-edit-input" value="${current}" onblur="saveStepEdit(${i}, this.value)" onkeydown="if(event.key==='Enter')this.blur()">`;
  titleEl.querySelector('input').focus();
}

function saveStepEdit(i, val) {
  const p = projects.find(x => x.id === currentProjectId);
  if (!p) return;
  if (val.trim()) p.steps[i].title = val.trim();
  save();
  renderSteps();
}

function deleteStep(i) {
  const p = projects.find(x => x.id === currentProjectId);
  if (!p) return;
  p.steps.splice(i, 1);
  save();
  renderDetail();
}

function handleAddStep(e) {
  if (e.key === 'Enter') addStep();
}

function addStep() {
  const input = document.getElementById('new-step-input');
  const val = input.value.trim();
  if (!val) return;
  const p = projects.find(x => x.id === currentProjectId);
  if (!p) return;
  if (!p.steps) p.steps = [];
  p.steps.push({ id: genId(), title: val, checked: false, notes: '' });
  input.value = '';
  save();
  renderDetail();
  showToast('Step added');
}

// ── BUDGET ──
function getSpent(p) {
  if (p.itemize) {
    return (p.expenses || []).reduce((sum, e) => sum + (parseFloat(e.amount) || 0), 0);
  }
  return parseFloat(p.spentGeneral) || 0;
}

function renderBudgetSection() {
  const p = projects.find(x => x.id === currentProjectId);
  if (!p) return;
  const section = document.getElementById('budget-detail-section');
  const budget = parseFloat(p.budget) || 0;

  if (!budget) {
    section.style.display = 'none';
    return;
  }
  section.style.display = '';

  const spent = getSpent(p);
  const remaining = budget - spent;
  const overBudget = spent > budget;

  const summaryRow = document.getElementById('budget-summary-row');
  summaryRow.innerHTML = `
    <div class="budget-summary-box">
      <div class="budget-summary-amount">$${budget.toFixed(2)}</div>
      <div class="budget-summary-desc">Total Budget</div>
    </div>
    <div class="budget-summary-box">
      <div class="budget-summary-amount">$${spent.toFixed(2)}</div>
      <div class="budget-summary-desc">Spent</div>
    </div>
    <div class="budget-summary-box ${overBudget ? 'over-budget' : ''}">
      <div class="budget-summary-amount">${overBudget ? '-' : ''}$${Math.abs(remaining).toFixed(2)}</div>
      <div class="budget-summary-desc">${overBudget ? 'Over Budget' : 'Remaining'}</div>
    </div>`;

  const expenseList = document.getElementById('expenses-list');
  const addRow = document.getElementById('add-expense-row');

  if (p.itemize) {
    addRow.style.display = 'grid';
    const expenses = p.expenses || [];
    if (!expenses.length) {
      expenseList.innerHTML = `<div style="text-align:center;padding:18px;color:var(--text-muted);font-size:13px;">No expenses logged yet</div>`;
    } else {
      expenseList.innerHTML = expenses.map((e, i) => `
        <div class="expense-item">
          <span class="expense-desc">${e.desc}</span>
          <span class="expense-amount">$${parseFloat(e.amount).toFixed(2)}</span>
          <button class="expense-delete" onclick="deleteExpense(${i})">✕</button>
        </div>`).join('');
    }
  } else {
    addRow.style.display = 'none';
    expenseList.innerHTML = `
      <div style="padding:12px 0;">
        <label class="form-label" style="margin-bottom:6px;display:block;">Amount Spent So Far</label>
        <div style="display:flex;gap:10px;align-items:center;">
          <input class="form-input" type="number" min="0" step="0.01" placeholder="0.00"
            value="${p.spentGeneral || ''}"
            onchange="updateGeneralSpent(this.value)"
            style="max-width:180px;">
          <span style="font-size:13px;color:var(--text-light);">of $${budget.toFixed(2)} budgeted</span>
        </div>
      </div>`;
  }
}

function updateGeneralSpent(val) {
  const p = projects.find(x => x.id === currentProjectId);
  if (!p) return;
  p.spentGeneral = parseFloat(val) || 0;
  save();
  renderDetail();
}

function addExpense() {
  const desc = document.getElementById('expense-desc-input').value.trim();
  const amount = document.getElementById('expense-amount-input').value.replace('$','').trim();
  if (!desc || !amount) { showToast('Enter a description and amount'); return; }
  const p = projects.find(x => x.id === currentProjectId);
  if (!p) return;
  if (!p.expenses) p.expenses = [];
  p.expenses.push({ id: genId(), desc, amount: parseFloat(amount) });
  document.getElementById('expense-desc-input').value = '';
  document.getElementById('expense-amount-input').value = '';
  save();
  renderDetail();
  showToast('Expense added');
}

function deleteExpense(i) {
  const p = projects.find(x => x.id === currentProjectId);
  if (!p) return;
  p.expenses.splice(i, 1);
  save();
  renderDetail();
}

// ── PROJECT MODAL ──
function openNewProjectModal(editId) {
  editingProjectId = editId || null;
  const modal = document.getElementById('project-modal');
  const title = document.getElementById('modal-title');

  if (editId) {
    const p = projects.find(x => x.id === editId);
    if (p) {
      title.textContent = 'Edit Project';
      document.getElementById('f-name').value = p.name || '';
      document.getElementById('f-category').value = p.category || 'personal';
      document.getElementById('f-status').value = p.status || 'active';
      document.getElementById('f-start').value = p.startDate || '';
      document.getElementById('f-end').value = p.endDate || '';
      document.getElementById('f-budget').value = p.budget || '';
      document.getElementById('f-itemize').checked = !!p.itemize;
    }
  } else {
    title.textContent = 'New Project';
    document.getElementById('f-name').value = '';
    document.getElementById('f-category').value = 'personal';
    document.getElementById('f-status').value = 'active';
    document.getElementById('f-start').value = '';
    document.getElementById('f-end').value = '';
    document.getElementById('f-budget').value = '';
    document.getElementById('f-itemize').checked = false;
  }

  modal.classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 100);
}

function closeProjectModal() {
  document.getElementById('project-modal').classList.remove('open');
  editingProjectId = null;
}

function saveProject() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { showToast('Project name is required'); document.getElementById('f-name').focus(); return; }

  if (editingProjectId) {
    const p = projects.find(x => x.id === editingProjectId);
    if (p) {
      p.name = name;
      p.category = document.getElementById('f-category').value;
      p.status = document.getElementById('f-status').value;
      p.startDate = document.getElementById('f-start').value;
      p.endDate = document.getElementById('f-end').value;
      p.budget = document.getElementById('f-budget').value;
      p.itemize = document.getElementById('f-itemize').checked;
    }
    showToast('Project updated');
  } else {
    const p = {
      id: genId(),
      name,
      category: document.getElementById('f-category').value,
      status: document.getElementById('f-status').value,
      startDate: document.getElementById('f-start').value,
      endDate: document.getElementById('f-end').value,
      budget: document.getElementById('f-budget').value,
      itemize: document.getElementById('f-itemize').checked,
      steps: [],
      expenses: [],
      spentGeneral: 0
    };
    projects.push(p);
    showToast('Project created');
  }

  save();
  closeProjectModal();

  if (currentProjectId) {
    renderDetail();
  } else {
    renderDashboard();
  }
}

function editCurrentProject() {
  openNewProjectModal(currentProjectId);
}

// ── UTILS ──
function formatDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[parseInt(m)-1]} ${parseInt(day)}, ${y}`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// Close modal on overlay click
document.getElementById('project-modal').addEventListener('click', function(e) {
  if (e.target === this) closeProjectModal();
});

// ── INIT ──
load();
renderDashboard();

// ── SERVICE WORKER ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
